```yaml
name: Simplified Deploy

on:
  push:
    branches: [main]

jobs:
  test-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: List directories
        run: |
          echo "Repository structure:"
          ls -la
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1
          
      - name: Verify AWS authentication
        run: |
          aws sts get-caller-identity
          
      - name: Check for deployment files
        run: |
          if [ -f "deploy-template.yml" ]; then
            echo "Deploy template found"
          else
            echo "Deploy template NOT found"
            find . -name "deploy*.yml" -type f
          fi
          
          if [ -d "./ai-sec" ]; then
            echo "AI-sec directory found"
          else
            echo "AI-sec directory NOT found"
          fi