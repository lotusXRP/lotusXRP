```yaml
name: Deploy to AWS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push AI-Sec image
        run: |
          docker build -t ai-sec ./ai-sec
          docker tag ai-sec:latest ${{ steps.login-ecr.outputs.registry }}/lotusxrp-ai-sec:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/lotusxrp-ai-sec:latest

      - name: Deploy stack
        run: |
          aws cloudformation deploy \
            --template-file deploy-template.yml \
            --stack-name lotusxrp-stack \
            --capabilities CAPABILITY_IAM