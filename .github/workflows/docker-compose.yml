```yaml
name: Deploy to AWS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup directory structure
        run: |
          mkdir -p cloudformation
          if [ ! -f "./cloudformation/deploy-template.yml" ]; then
            if [ -f "./deploy-template.yml" ]; then
              cp ./deploy-template.yml ./cloudformation/
            fi
          fi
          mkdir -p ai-sec
          if [ ! -f "./ai-sec/Dockerfile" ]; then
            echo "FROM ubuntu:latest" > ./ai-sec/Dockerfile
            echo "RUN echo 'This is a placeholder'" >> ./ai-sec/Dockerfile
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      - name: Verify AWS authentication
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if not exists
        run: |
          aws ecr describe-repositories --repository-names lotusxrp-ai-sec || aws ecr create-repository --repository-name lotusxrp-ai-sec

      - name: Build and push AI-Sec image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t ai-sec ./ai-sec
          docker tag ai-sec:latest ${ECR_REGISTRY}/lotusxrp-ai-sec:latest
          docker push ${ECR_REGISTRY}/lotusxrp-ai-sec:latest

      - name: Deploy stack
        run: |
          aws cloudformation deploy \
            --template-file ./cloudformation/deploy-template.yml \
            --stack-name lotusxrp-stack \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset
```